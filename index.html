<!DOCTYPE html>
<html>
<head>
    <title>CA Student Portal</title>

    <style>
        #loader {
            display: none;
            font-size: 18px;
            color: blue;
        }
    </style>

</head>

<body style="text-align:center; font-family:Arial;">

    <h1>CA Student Portal</h1>

    <input type="text" id="roll" placeholder="Enter Roll Number">
    <br><br>

    <!-- CAPTCHA -->
    <h3 id="captchaText"></h3>
    <input type="text" id="captchaInput" placeholder="Enter Captcha">
    <br><br>

    <button onclick="checkResult()">Get Result</button>

    <!-- LOADING -->
    <p id="loader">⏳ Loading...</p>

    <div id="output"></div>

    <script>
        let captchaValue = "";

function generateCaptcha() {
    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    captchaValue = "";

    for (let i = 0; i < 6; i++) {
        captchaValue += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById("captchaText").innerHTML = "Captcha: " + captchaValue;
}

window.onload = function() {
    generateCaptcha();
};

        function checkResult() {
            let roll = document.getElementById("roll").value;
            let userCaptcha = document.getElementById("captchaInput").value;

            // CAPTCHA CHECK
            if (userCaptcha !== captchaValue) {
                document.getElementById("output").innerHTML =
                "<p style='color:red;'>Wrong Captcha</p>";
                generateCaptcha();
                return;
            }

            // SHOW LOADER
            document.getElementById("loader").style.display = "block";
            document.getElementById("output").innerHTML = "";

            // SIMULATE LOADING (2 sec)
            setTimeout(function() {

                document.getElementById("loader").style.display = "none";

                if (roll == "636573") {
                document.getElementById("output").innerHTML =
`<img src="https://raw.githubusercontent.com/shuklaharsh12/ca-student-portal/main/7C29E8E3-AB1F-4989-932E-8AA51D281DF2.png" width="100%">`;
                    
                } else {
                    document.getElementById("output").innerHTML =
                    "<p style='color:red;'>Invalid Roll Number</p>";
                }

            }, 2000);
        }

        // ON LOAD
        generateCaptcha();
    </script>

</body>
</html>
